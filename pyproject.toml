[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpcm"
version = "0.1.0"
description = "FPCM toolbox"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy", "mne", "matplotlib", "nibabel"]

[tool.setuptools]
py-modules = ["fpcm_detector", "summary", "source_loc", "utils"]
